<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Nice website with Games, Art and other things made by TheShovel!!" />
  <link rel="icon" type="image/x-icon" href="favicon.ico" />
  <title>TheShovel</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Comic+Neue:ital,wght@0,400;0,700;1,400&display=swap"
    rel="stylesheet"
  />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div id="bg" aria-hidden="true"></div>

  <header id="topbar">
    <a id="logo" href="#home" title="Home">
      <img id="logo-text" src="imageSources/LogoText-crop.PNG" alt="THE SHOVEL" />
    </a>
    <div id="banner">
      <button id="banner-prev" aria-label="Previous banner">&lt;</button>
      <a id="banner-link" href="updates/bannerupdate.html">
        <img id="banner-img" src="banner/updatebanner.png" alt="website update" />
      </a>
      <button id="banner-next" aria-label="Next banner">&gt;</button>
      <div id="banner-dots"></div>
    </div>
  </header>

  <main id="content">
    <div id="grid" aria-live="polite"></div>
  </main>

  <footer id="bottombar">
    <div id="footer-left">
      <a id="footer-head" href="#home" title="Home" aria-label="Home">
        <img id="footer-head-img" src="imageSources/Icon-tight.PNG" alt="bopping head" />
      </a>
      <div id="footer-links">
        <nav id="site-links">
          <a href="credits/">credits</a>
          <span>·</span>
          <a href="privacy-policy/">privacy</a>
        </nav>
      </div>
    </div>
    <section id="goal-card" aria-label="Ko-fi goal tracker" hidden>
      <span id="goal-title"></span>
      <span id="goal-bar" role="img" aria-hidden="true"><span id="goal-fill"></span></span>
      <span id="goal-amounts"></span>
      <span id="goal-desc"></span>
      <a id="goal-donate" href="https://ko-fi.com/theshovel" target="_blank" rel="noopener">Donate</a>
      <span id="goal-updated"></span>
    </section>
  </footer>

  <div id="viewer" hidden>
    <div class="viewer-bar">
      <button id="viewer-back">← Back</button>
      <span id="viewer-title"></span>
      <span id="viewer-zoom" hidden>
        <button id="viewer-zoom-out" aria-label="Zoom out">−</button>
        <button id="viewer-zoom-label" aria-label="Reset zoom">100%</button>
        <button id="viewer-zoom-in" aria-label="Zoom in">+</button>
      </span>
    </div>
    <div class="viewer-body" id="viewer-body">
        <img id="viewer-img" alt="" hidden />
        <div id="viewer-paper">
          <div id="viewer-sheet-back" aria-hidden="true" hidden></div>
          <div id="viewer-text" hidden></div>
        </div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
